{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Register</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>

    <p>
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </p>
</div>
{% endblock %}
