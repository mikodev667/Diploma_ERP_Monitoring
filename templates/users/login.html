{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
    </form>

    <p>
        No account? <a href="{% url 'register' %}">Create one</a>
    </p>
</div>
{% endblock %}
