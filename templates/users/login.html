{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<style>
    .auth-main {
        min-height: calc(100vh - 86px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 20px;
        background:
            radial-gradient(circle at 18% 18%, rgba(37, 99, 235, 0.16), transparent 32%),
            radial-gradient(circle at 82% 72%, rgba(6, 182, 212, 0.18), transparent 34%),
            linear-gradient(135deg, #f8fbff 0%, #eef5ff 48%, #eaf8ff 100%);
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        padding: 34px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(18px);
        position: relative;
        overflow: hidden;
    }

    .auth-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 24px;
        right: 24px;
        height: 5px;
        border-radius: 0 0 999px 999px;
        background: linear-gradient(90deg, #2563eb, #06b6d4, #22c55e);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: linear-gradient(135deg, #2563eb, #06b6d4);
        color: #ffffff;
        font-size: 26px;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.28);
    }

    .auth-title {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #0f172a;
    }

    .auth-subtitle {
        margin: 8px auto 0;
        max-width: 310px;
        font-size: 15px;
        line-height: 1.6;
        color: #64748b;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .auth-form p {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .auth-form label {
        font-size: 14px;
        font-weight: 700;
        color: #0f172a;
    }

    .auth-form input {
        width: 100%;
        height: 50px;
        padding: 0 15px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.36);
        background: #eef5ff;
        color: #0f172a;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: 0.2s ease;
    }

    .auth-form input:focus {
        border-color: #2563eb;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .auth-form ul.errorlist {
        margin: 0 0 -6px;
        padding: 12px 14px;
        list-style: none;
        border-radius: 14px;
        background: rgba(239, 68, 68, 0.09);
        border: 1px solid rgba(239, 68, 68, 0.22);
        color: #dc2626;
        font-size: 13px;
        line-height: 1.5;
    }

    .auth-button {
        height: 52px;
        margin-top: 6px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #2563eb, #0891b2);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.25);
        transition: 0.2s ease;
    }

    .auth-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 36px rgba(37, 99, 235, 0.32);
    }

    .auth-footer {
        margin: 24px 0 0;
        padding-top: 20px;
        border-top: 1px solid rgba(148, 163, 184, 0.24);
        text-align: center;
        font-size: 14px;
        color: #64748b;
    }

    .auth-footer a {
        color: #2563eb;
        font-weight: 800;
        text-decoration: none;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 520px) {
        .auth-main {
            padding: 32px 14px;
        }

        .auth-card {
            padding: 28px 22px;
            border-radius: 24px;
        }

        .auth-title {
            font-size: 26px;
        }
    }
</style>
{% endblock %}

{% block main %}
<main class="auth-main">
    <section class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">↗</div>
            <h2 class="auth-title">Welcome back</h2>
            <p class="auth-subtitle">
                Sign in to continue working with your ERP monitoring platform.
            </p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="auth-button">
                Sign in
            </button>
        </form>

        <p class="auth-footer">
            No account?
            <a href="{% url 'register' %}">Create one</a>
        </p>
    </section>
</main>
{% endblock %}
